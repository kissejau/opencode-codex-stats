name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack --dry-run
      - run: npm install -g @opencode/cli@2.4.2
      - run: python3 test/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node --test test/sidebar.test.mjs
